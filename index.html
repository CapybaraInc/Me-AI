<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Поэт и Певец</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <div class="app-container">
        <h1 class="title">🎭 НейроПоэт</h1>
        <p class="subtitle">Стихи и песни от ИИ</p>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="poem">📝 Стихи</button>
            <button class="mode-btn" data-mode="song">🎵 Песня</button>
        </div>

        <div class="input-group">
            <label>Тема или первая строка:</label>
            <input type="text" id="prompt" placeholder="Например: звёздная ночь..." maxlength="100">
        </div>

        <div class="style-group" id="poemStyles">
            <label>Стиль:</label>
            <select id="poemStyle">
                <option value="pushkin">Пушкин</option>
                <option value="esenin">Есенин</option>
                <option value="akhmatova">Ахматова</option>
                <option value="mayakovsky">Маяковский</option>
                <option value="custom">Свободный стиль</option>
            </select>
        </div>

        <div class="style-group hidden" id="songStyles">
            <label>Жанр песни:</label>
            <select id="songStyle">
                <option value="pop">Поп</option>
                <option value="rock">Рок</option>
                <option value="rap">Рэп</option>
                <option value="folk">Народная</option>
            </select>
        </div>

        <button id="generateBtn" class="generate-btn">✨ Сгенерировать</button>
        
        <div class="output-container">
            <div class="output-header">
                <h3 id="outputTitle">Ваше творение</h3>
                <button id="copyBtn" class="icon-btn">📋</button>
            </div>
            <div id="output" class="output-text">
                <p class="placeholder">Здесь появится ваше стихотворение или песня...</p>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Нейросеть сочиняет...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
